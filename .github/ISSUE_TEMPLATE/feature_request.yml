name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TidalRPC is a lightweight, macOS-only app. Requests for Windows support or features that read Discord's interface are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or goal, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for the feature, including where it would appear in the menu or settings.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
